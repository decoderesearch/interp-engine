name: Comparison

# Cross-engine activation comparison (see validator/). Compares eager vs TransformerLens
# (v2 no_processing + v3 TransformerBridge) vs nnsight/nnterp (eager, resid+MLP+attention) and vLLM
# + SGLang (resid_post). Results are written into the Correctness table in validator/README.md.
#
# MANUAL / LOCAL ONLY. This needs an Ampere+ GPU for the fused engines (vLLM/SGLang) and the full
# 6-engine table. GitHub-hosted runners have no suitable GPU (hosted GPU is a Tesla T4, sm_75) and
# we don't run a self-hosted runner, so this workflow does NOT auto-run on push/PR — it's kept for
# reference and manual dispatch (on a machine/runner that has a CUDA GPU + docker).
#
# In practice the table is regenerated by running the validator locally, which is the supported
# path and the one that is actually exercised: see validator/docs/COMPARISON.md. Note that this
# workflow runs the fused engines in docker containers, whereas that doc uses native venvs — docker
# is unusable on a container-based GPU host (RunPod and friends), where you cannot nest containers,
# and the native venvs work everywhere.
#
# The validator and the engine it scores now live in one repo, so every job is a single checkout and
# the engine is installed from `..`. This used to check `decoderesearch/interp-engine` out a second
# time into `../interp-engine` in each job, which is what the pip invocations below no longer need.
#
# If you register an Ampere+ [self-hosted, gpu] runner later, re-add the push/pull_request triggers
# below to bring auto-runs back.
#
# NOTE ON PATHS: `defaults.run.working-directory` applies to `run:` steps only. The `path:` inputs of
# upload-artifact/download-artifact are always relative to the workspace root, so those carry the
# `validator/` prefix explicitly and the `run:` steps do not.

on:
  workflow_dispatch: {}

concurrency:
  group: comparison-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: validator

jobs:
  tokenize:
    # `[self-hosted, gpu]` has nothing registered against it by default (see the header) -- attach
    # your own CUDA box under those labels before dispatching. This job also reports whether CUDA
    # is available so the fused jobs can gate themselves; on a CPU-only runner they skip and only
    # the eager 3 run.
    runs-on: [self-hosted, gpu]
    outputs:
      cuda: ${{ steps.detect.outputs.cuda }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect CUDA
        id: detect
        run: |
          if command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi >/dev/null 2>&1; then
            echo "cuda=true" >> "$GITHUB_OUTPUT"
          else
            echo "cuda=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Tokenize inputs (shared by all engines)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv venv --python 3.12 .venv-cmp
          uv pip install --python .venv-cmp -e '..' -e '.'
          PYTHONPATH=. HF_HUB_OFFLINE=0 .venv-cmp/bin/python -m comparison.tokenize_inputs --dumps dumps
      - uses: actions/upload-artifact@v4
        with:
          name: inputs
          path: validator/dumps/inputs/

  eager:
    needs: tokenize
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - uses: actions/download-artifact@v4
        with:
          name: inputs
          path: validator/dumps/inputs/
      - name: Run the eager-family engines (eager, tlens_v2, tlens_v3, nnsight)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CUDA: ${{ needs.tokenize.outputs.cuda }}
        run: |
          uv venv --python 3.12 .venv-cmp
          uv pip install --python .venv-cmp -e '..' -e '.'
          DEVICE=cpu; [ "$CUDA" = "true" ] && DEVICE=cuda
          for engine in eager tlens_v2 tlens_v3 nnsight; do
            PYTHONPATH=. HF_HUB_OFFLINE=0 .venv-cmp/bin/python -m comparison.run_engine \
              --engine "$engine" --dumps dumps --device "$DEVICE" || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: dump-eager
          path: validator/dumps/

  vllm:
    needs: tokenize
    if: needs.tokenize.outputs.cuda == 'true'
    runs-on: [self-hosted, gpu]
    container:
      image: vllm/vllm-openai:latest
      options: --gpus all --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: inputs
          path: validator/dumps/inputs/
      - name: Run vLLM resid capture (own worker extension, no vllm-lens)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Avoid the FlashInfer sampler's JIT path; the comparison only needs a 1-token forward.
          VLLM_USE_FLASHINFER_SAMPLER: '0'
        run: |
          # vLLM image ships `python3` only. Gemma (head_dim=256) auto-runs bf16 in the adapter.
          python3 -m pip install --no-deps -e .. -e .   # engine + harness; keep vLLM's torch
          python3 -m pip install numpy || true
          PYTHONPATH=. python3 -m comparison.run_engine --engine vllm --dumps dumps --device cuda || true
      - uses: actions/upload-artifact@v4
        with:
          name: dump-vllm
          path: validator/dumps/

  sglang:
    needs: tokenize
    if: needs.tokenize.outputs.cuda == 'true'
    runs-on: [self-hosted, gpu]
    container:
      image: lmsysorg/sglang:latest
      options: --gpus all --ipc=host --shm-size=16g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: inputs
          path: validator/dumps/inputs/
      - name: Run SGLang resid capture (hooks injected into the scheduler subprocess)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # SGLang image ships `python3` only; it serves bf16 (float32 is unsupported). The adapter
          # sets PYTHONPATH/env so its scheduler child imports comparison/engines/sglang_inject.
          python3 -m pip install --no-deps -e .. -e .
          python3 -m pip install numpy || true
          PYTHONPATH=. python3 -m comparison.run_engine --engine sglang --dumps dumps --device cuda || true
      - uses: actions/upload-artifact@v4
        with:
          name: dump-sglang
          path: validator/dumps/

  aggregate:
    # Runs regardless of which engine jobs succeeded/were skipped; merges whatever dumps exist.
    needs: [eager, vllm, sglang]
    if: always()
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - uses: actions/download-artifact@v4
        with:
          pattern: dump-*
          path: validator/dumps-merged/
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: inputs
          path: validator/dumps-merged/inputs/
      - name: Aggregate + update the validator README (only if meaningfully different)
        run: |
          uv venv --python 3.12 .venv-agg
          uv pip install --python .venv-agg numpy
          PYTHONPATH=. .venv-agg/bin/python -m comparison.aggregate --dumps dumps-merged --readme README.md
      - name: Commit the validator README if it changed (push to main only)
        if: github.event_name == 'push'
        run: |
          if ! git diff --quiet -- README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update cross-engine comparison table [skip ci]"
            git push
          else
            echo "validator/README.md unchanged; nothing to commit."
          fi
