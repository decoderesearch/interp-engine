[project]
name = "interp-engine"
version = "1.4.0"
description = "A fast, standardized, and easy to use interpretability engine."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
# Unpinned upper bounds on purpose: the engine is a thin wrapper over `transformers` and is
# designed to track new releases (incl. transformers v5, needed for newer models like
# Qwen3.6 and gpt-oss MXFP4 kernels). The inference app now pins `>=5.14` itself (vLLM 0.25
# requires it), so the shared inference venv and the engine's own venv both resolve v5.
#
# What the transformers floor does and does not promise. Two versions are actually exercised:
# 4.57.1, by the `floor` CI job (config arithmetic only, no weights), and whatever the CI venv
# resolves today, by everything else. In between is untested, and "supported" here means the engine
# reads the config correctly -- NOT that two versions produce the same activations. They do not: a
# transformers release can change the forward pass (DeepSeek-V2's YaRN `mscale`, fixed in 5.15.0)
# or move where a config keeps a fact (Gemma-4's per-layer `head_dim`, 5.15.0), and this engine
# faithfully reports whichever one is installed. `facts.TRANSFORMERS_CAVEATS` warns at load for the
# combinations known to be wrong; docs/COMPATIBILITY.md has the reasoning and what to do about it.
dependencies = [
    "torch>=1.10",
    "transformers>=4.57.1",
    "einops",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    # Capped at <9 to match validator/ and apps/inference in the Neuronpedia monorepo, so the
    # suite runs under one pytest version whichever venv invokes it.
    "pytest>=8.3.1,<9",
    # Same ranges as validator/, so one `ruff format` verdict and one pyright rule set covers
    # this repo. Both are capped at a single minor: `ruff format` output and pyright's checks
    # change between releases, and CI gates on both (this project installs from pyproject rather
    # than uv.lock, so the cap here is the only pin).
    "ruff>=0.16.2,<0.17",
    "pyright>=1.1.411,<1.2",
    # tests/model_expectations.yaml. Present transitively via transformers, but the test suite
    # imports it directly, so declare it rather than depend on someone else's dependency.
    "pyyaml>=6",
]
# The engine-owned vLLM backend (vllm_backend.py / vllm_capture/). vLLM is Linux/CUDA-only
# and heavy, and the engine imports it LAZILY, so it stays OUT of the base deps (the
# EagerModel core must install on macOS/CPU). Apps that actually run the vLLM backend depend on
# `interp-engine[vllm]` so the version pin lives here, next to the code that imports it.
#
# A FLOOR, not a ceiling, and deliberately uncapped: 0.27.1 is the oldest version there is evidence
# for, not the version to run. Raise it only when engine code needs a newer API, and name that code.
# Raised from 0.25.1 for `vllm_capture/mhc.py`, which reaches DeepSeek-V4's hyper-connection points
# by patching all four tilelang mHC kernels in the model module's namespace (`KERNEL_NAMES`). One of
# them, `mhc_pre_broadcast_tilelang`, does not exist before 0.26.0, so on 0.25.x every mHC point --
# `resid_streams` included, which `STATIC_POINTS=auto` selects on such a trunk -- is refused at
# install and the pod fails to load. 0.27.1 rather than 0.26.0 because that is the version the
# DeepSeek-V4-Flash-0731 cross-engine comparison actually scored (validator/comparison/results/
# deepseek-ai/DeepSeek-V4-Flash-0731/). See docs/PERFORMANCE.md, "The vLLM version is a floor, not a
# ceiling", for why there is no upper bound and what to do when an upstream release breaks capture.
#
# Why this is an extra and NOT a marker-gated base dependency, which is the recurring suggestion:
# packaging has no "install this if you can, warn if you cannot". A dependency either resolves or
# fails the whole install, and the only thing a marker can branch on is static platform metadata --
# `sys_platform`, `platform_machine`, `python_version` -- never whether the machine has a CUDA
# device, which is the fact that actually decides whether vLLM is usable. So moving this line into
# `dependencies` would trade today's outcome ("`pip install interp-engine` succeeded, vLLM absent,
# `require_vllm` says so on first use") for `pip install interp-engine` failing outright wherever no
# compatible wheel exists -- a Python version vLLM has not built for yet, an arch it does not
# publish, or a resolver conflict with a pinned torch -- while STILL installing several GB of CUDA
# wheels on every GPU-less Linux box, because the marker cannot see the GPU either. Best effort is
# therefore expressed at the call site instead: `pip install interp-engine && pip install
# 'interp-engine[vllm]' || echo ...` (docs/USAGE.md), where the second command is allowed to fail.
# The `sys_platform` marker below is the one axis a marker CAN answer: it makes the extra itself a
# no-op on macOS rather than an error, so `[vllm]` is safe to ask for unconditionally.
vllm = [
    "vllm>=0.27.1; sys_platform == 'linux'",
]
# MXFP4-quantized models (e.g. gpt-oss) and block-FP8 ones (DeepSeek-V4-Flash) need the Triton kernel
# loader, which in turn needs huggingface-hub>=1.0 / transformers>=5. Missing it is not always an
# error: for MXFP4 transformers warns and dequantizes to bf16 (~3x the weights), while the
# finegrained-FP8 path raises from the first matmul, naming the version it wants. Either way, keep this
# installed wherever quantized checkpoints are served. apps/inference depends on this extra;
# standalone: `uv pip install -e '.[quant]'`.
#
# transformers gates `kernels` to a narrow window and MOVES it between minor releases -- 5.14 wants
# >=0.15.2,<0.16.0, 5.15 wants >=0.16.0,<0.17.0 -- and consecutive windows do not overlap, so no single
# pin satisfies both and this range spans them rather than choosing for you. Which end is correct is
# decided by the transformers in the venv, not by this file: a resolver taking the newest `kernels`
# into a 5.14 environment gets a refusal from `is_kernels_available` that names the window it wanted,
# and the fix is to install that version rather than to widen anything here.
quant = [
    "kernels>=0.15.2,<0.17.0",
    # transformers' quantized load paths (device_map / weight dispatch) require accelerate — without
    # it loading gpt-oss raises `ImportError: Using mxfp4 requires Accelerate`, and a block-quantized
    # FP8 checkpoint (DeepSeek-V4-Flash) raises `Loading an FP8 quantized model requires accelerate`.
    # Both fail at load, so an eager column that never had this extra reads as "the model does not
    # work here" rather than "one wheel is missing".
    "accelerate>=1.0",
]
# AWQ / GPTQ quantized checkpoints (e.g. casperhansen/*-awq, llama-70b-instruct-awq). On
# transformers v5 these load through the `gptqmodel` backend — it replaced the deprecated `autoawq`
# (which pinned transformers<=4.47.1 and so cannot co-resolve with the engine's >=4.57 floor).
# `accelerate` is required for the quantized load path and for multi-GPU `device_map` sharding
# (needed to fit e.g. a 70B AWQ across GPUs). CUDA-only backend — OPTIONAL so CPU/non-CUDA installs
# of the base engine still work; install into a CUDA venv: `uv pip install -e '.[awq]'`. Note: AWQ
# CUDA kernels run fp16 (bf16 is auto-downcast). Validate a new quantized model against an
# independent implementation before wiring it in — a quantized load that returns plausible logits is
# not evidence that the captured activations are right.
awq = [
    "gptqmodel>=5.0",
    "accelerate>=1.0",
]
# The single reference backend the pytest suite needs: TransformerLens, for the gpt2 golden parity
# gate (tests/test_parity_gpt2.py). It is deliberately the ONLY third-party engine any test loads --
# a broader set of reference backends pulls ~50 packages that nothing here imports, so CI installs
# `.[dev,parity]` and a PR pays for one extra wheel.
parity = [
    "transformer-lens>=3.0",
]

# The only links on the PyPI page: the README's own doc links are repo-relative and PyPI does not
# resolve those. The engine is the root of its own repo again, so these point at the repo root
# rather than into a monorepo subdirectory as they did while it shipped from Neuronpedia.
[project.urls]
Homepage = "https://github.com/decoderesearch/interp-engine"
Repository = "https://github.com/decoderesearch/interp-engine"
Issues = "https://github.com/decoderesearch/interp-engine/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["interp_engine"]

# The sdist needs an explicit list now that the validator and the visualizer sit beside the package.
# hatchling's default is "everything not gitignored", which shipped validator/ (including its
# committed result cells) and a whole Next.js app inside `pip download --no-binary interp-engine`.
# The wheel was never affected -- `packages` above already scoped it to interp_engine/.
[tool.hatch.build.targets.sdist]
# Leading slashes anchor each pattern to the repo root. Without them these are gitignore-style
# patterns that match at any depth, so a bare `tests` also pulled in validator/tests.
include = [
  "/interp_engine",
  "/tests",
  "/docs",
  "/benchmarks",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
]

# --------------------------------------------------------------- lint / types --
# The ruff and pyright config below is shared verbatim with validator/pyproject.toml, because
# neither tool can inherit config from outside its own project directory. Deviations are per-project
# paths only (`include`, `exclude`, `venv`), and each is commented as such. Change a rule in both or
# in neither; the `config-parity` job in .github/workflows/validator-tests.yml fails if the copies
# diverge.
#
# It is also kept in step with the five services in the Neuronpedia monorepo, which consume this
# package. That copy is no longer enforceable from here now that the engine is its own repo, so it
# is a convention rather than a check: a rule change here is worth mirroring there.

[tool.ruff]
line-length = 120
# target-version is inferred from project.requires-python above.
# `*.md`: ruff 0.16 formats Python code blocks in Markdown by default. Every workflow that runs
# this gate filters Markdown out of its `paths:`, so a docs-only change cannot run the check and
# the failure lands on the next unrelated Python edit instead. Doc examples are also aligned by
# hand for reading, which the formatter collapses. Keep the two decisions together: re-enabling
# this means dropping those `!**/*.md` filters as well.
extend-exclude = ["*.ipynb", "*.md"]

[tool.ruff.lint]
# pyflakes + pycodestyle errors (F/E) as the floor, plus the rule families that catch defects
# rather than taste: isort (I), pyupgrade (UP), bugbear (B), comprehensions (C4), simplify (SIM),
# return (RET), logging (LOG), and tidy-imports (TID) for the banned typing aliases below.
# Deliberately NOT selected: ANN/D (annotation and docstring mandates), ARG (unused arguments,
# which fire on every framework-required signature), and T20 (bans `print`, which several of
# the apps use as their logging).
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RET", "LOG", "TID"]
ignore = [
  # Line length is the formatter's job. E501 would only fire on the strings, URLs and comments
  # the formatter cannot split, i.e. exactly the cases where wrapping is not an improvement.
  "E501",
  # zip-without-explicit-strict. The correct fix is usually `strict=True`, but that changes
  # behaviour at each of the ~30 call sites in this repo, and a blanket `strict=False` only
  # restates the default while adding noise. Off until someone audits them for real.
  "B905",
]

[tool.ruff.lint.flake8-bugbear]
# B008 (function call in a default argument) is the FastAPI dependency-injection idiom in the apps,
# not the mutable-default bug the rule is aimed at. Kept here only so the shared block stays
# identical across projects; the engine imports no FastAPI.
extend-immutable-calls = [
  "fastapi.Body",
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Form",
  "fastapi.Header",
  "fastapi.Path",
  "fastapi.Query",
  "fastapi.Security",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Union".msg = "Use `|` instead"
"typing.Optional".msg = "Use `| None` instead"
"typing.Dict".msg = "Use `dict` instead"
"typing.List".msg = "Use `list` instead"

[tool.pyright]
# "standard" rather than "strict": strict additionally demands annotations on every parameter and
# type arguments on every generic, which flags hundreds of sites without catching real defects.
typeCheckingMode = "standard"
# torch and transformers ship no stubs for large parts of their surface, so this report is noise
# about our dependencies rather than about this code.
reportMissingTypeStubs = "none"
# Per-project deviation: package source only. Tests pull optional extras (vllm/transformer-lens)
# and are not gated here. Prefer `uv run pyright` (uses include); `uv run pyright .` still honors
# the exclude below. Local uv layouts use `.venv`; engine CI uses `.venv-ci` and must pass
# `--pythonpath .venv-ci/bin/python` so imports resolve.
#
# `reportMissingImports` stays ON, and `vllm_capture/`'s own `from vllm...` lines carry a per-line
# `# pyright: ignore[reportMissingImports]` instead. vLLM is a Linux/CUDA-only optional extra that
# the cpu job's venv does not have, so those imports are unresolvable exactly where this runs -- but
# switching the whole rule off would also stop reporting a misspelled first-party import. Note this
# is invisible locally: a `.venv` with vllm installed resolves them and reports nothing either way.
include = ["interp_engine"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "tests",
]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
# CI splits engine tests across two jobs (both fire on engine/** non-.md changes):
#   CPU (ubuntu):      `pytest -m "not gpu and not xl"` — golden parity + the three small models.
#   GPU (managed L4):  `pytest -m "gpu and not xl"`     — the same small models on CUDA/bf16.
# `xl` runs nowhere automatically: those models are tens of GB and only make sense on a big local
# box (`pytest -m xl` there). Locally, GPU tests self-skip without CUDA (skipif) and model loads
# skip when weights aren't cached, so a plain `pytest tests` on a CPU box runs the fast suite.
markers = [
    "gpu: requires a CUDA GPU (skipped automatically when torch.cuda is unavailable)",
    "xl: needs multi-GB weights (gemma-2-2b, gpt-oss-20b, Qwen3.6-27B) — local/dispatch only, never per-PR",
    "gated: requires HF_TOKEN for gated model access (auto-skipped when the token is absent)",
    "hub: reads a real config from huggingface.co with no skip-on-failure guard, so it fails rather than skips when the hub is unreachable — deselected by the offline `floor` CI job",
]
